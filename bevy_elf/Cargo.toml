[package]
name = "bevy_elf"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/Koettlitz/bevy_utils"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Serializable Bevy asset definitions that resolve string references into Handles"
keywords = ["bevy", "asset", "handles"]
categories = ["game-development"]

[features]
default = ["macros", "math", "app"]
macros = ["dep:bevy_elf_macros"]
app = ["dep:bevy_app", "bevy_elf_core/app"]
math = ["dep:bevy_math", "bevy_elf_core/math"]
image = ["dep:bevy_image", "bevy_elf_core/image"]

[[example]]
name = "animation"
required-features = ["image"]

[dependencies]
bevy_elf_macros = { optional = true, path = "../bevy_elf_macros"}
bevy_elf_core = { path = "../bevy_elf_core" }
bevy_asset = { workspace = true } 
bevy_app = { workspace = true, optional = true }
bevy_reflect = { workspace = true }
bevy_math = { workspace = true, optional = true, features = ["serialize"] }
bevy_image = { workspace = true, optional = true, features = ["serialize"] }
serde = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bevy = { workspace = true }
