[package]
name = "bevy_elf_macros"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Koettlitz/bevy_utils"
description = "Derive macros for bevy_elf"

[lib]
proc-macro = true

[dependencies]
bevy_elf_core = { path = "../bevy_elf_core", version = "=0.1.0" }
syn = { workspace = true, features = [ "full", "extra-traits" ] }
quote = { workspace = true } 
proc-macro2 = { workspace = true } 
proc-macro-crate = "3"
elf_macro_utils = { path = "../elf_macro_utils", version = "=0.1.0" }

[dev-dependencies]
bevy_elf = { path = "../bevy_elf" }
bevy_asset = { workspace = true }
bevy_image = { workspace = true } 
bevy_reflect = { workspace = true }
serde = { workspace = true }
prettyplease = "0.3"
trybuild = "1"
